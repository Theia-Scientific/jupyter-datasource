services:
  grafana:
    env_file: .env
    environment:
      GF_FEATURE_TOGGLES_ENABLE: localizationForPlugins
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    network_mode: host
    ports: !override []

  jupyter:
    build:
      context: ./
      dockerfile: Dockerfile.jupyter
    container_name: 'grafana-jupyter'
    env_file: .env
    network_mode: host
    volumes:
      - ./workspace:/home/jovyan/work
