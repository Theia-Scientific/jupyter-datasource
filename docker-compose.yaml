services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      GF_FEATURE_TOGGLES_ENABLE: localizationForPlugins
    ports: !override []
    network_mode: host

  jupyter:
    image: quay.io/jupyter/base-notebook:latest
    container_name: 'grafana-jupyter'
    network_mode: host
