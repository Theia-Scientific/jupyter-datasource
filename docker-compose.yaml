services:
  grafana:
    env_file: .env
    environment:
      GF_FEATURE_TOGGLES_ENABLE: localizationForPlugins
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  jupyter:
    build:
      context: ./
      dockerfile: Dockerfile.jupyter
      secrets:
        - envelope_token
    container_name: 'jupyter'
    env_file: .env
    ports:
      - 8888:8888/tcp

secrets:
  envelope_token:
    environment: ENVELOPE_TOKEN
