apiVersion: 1

datasources:
  - name: 'Jupyter'
    type: 'theia-jupyter-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    secureJsonData:
      rawToken: '${JUPYTER_TOKEN}'
    jsonData:
      connectionType: AUTO
      authType: RAW
      jupyterUrl: http://localhost:8888/api
      prelude: |
        from IPython.display import JSON
        from typing import Any, Dict, List

        def create_frame(name: str, data: List[Dict[str, Any]]):
            return JSON([{"name": name, "data": data}])
