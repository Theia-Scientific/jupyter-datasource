apiVersion: 1

datasources:
  - name: 'jupyter'
    type: 'theiascientific-jupyter-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      connectionType: AUTO
      authType: FETCH
      fetchRoute: http://localhost:7654/tokens/jupyter
      fetchMethod: PUT
      jupyterUrl: http://localhost:8888
