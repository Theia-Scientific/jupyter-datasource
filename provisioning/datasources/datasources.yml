apiVersion: 1

datasources:
  - name: 'Jupyter'
    type: 'theiascientific-jupyter-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      connectionType: AUTO
      authType: RAW
      rawToken: '${JUPYTER_TOKEN}'
      jupyterUrl: http://localhost:8888/api
      prelude: 'from IPython.display import JSON'
